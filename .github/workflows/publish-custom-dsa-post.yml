name: Publish Custom LinkedIn DSA Post

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: linkedin-custom-post-publication
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == 'Publish Custom LinkedIn Post now' &&
      (contains(github.event.issue.body, 'CUSTOM_POST_TOPIC=binary-search-cpp') || contains(github.event.issue.body, 'CUSTOM_POST_TOPIC=java-polymorphism'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate explicit custom-topic request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          body = os.getenv("ISSUE_BODY", "")
          if ("CUSTOM_POST_TOPIC=binary-search-cpp" not in body
                  and "CUSTOM_POST_TOPIC=java-polymorphism" not in body):
              raise SystemExit("Missing supported custom topic marker.")
          print("Validated owner request for a supported custom educational post.")
          PY

      - name: Check extra-post safety guard
        id: slot
        env:
          PUBLISH_INTENT: extra
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
        run: python3 src/check_publication_slot.py

  publish:
    needs: preflight
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == 'Publish Custom LinkedIn Post now' &&
      (contains(github.event.issue.body, 'CUSTOM_POST_TOPIC=binary-search-cpp') || contains(github.event.issue.body, 'CUSTOM_POST_TOPIC=java-polymorphism')) &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate the custom C++ binary-search post and slides
        env:
          PUBLISH_CUSTOM_TOPIC: ${{ contains(github.event.issue.body, 'CUSTOM_POST_TOPIC=java-polymorphism') && 'java-polymorphism' || 'binary-search-cpp' }}
        run: python src/generate_content.py

      - name: Render five-slide animated video
        run: python src/create_video.py

      - name: Validate post content and video format
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,pix_fmt,profile,level,bit_rate -show_entries format=duration,format_name -of json linkedin_video.mp4 > video_metadata.json
          python - <<'PY'
          import json
          from pathlib import Path

          content = json.loads(Path("content.json").read_text(encoding="utf-8"))
          topic = content.get("topic")
          if topic not in {
              "Binary Search in C++: Iterative and Recursive",
              "Java Polymorphism: Reference Type vs Runtime Object",
          }:
              raise SystemExit(f"Custom post topic mismatch: {topic!r}")
          post = content.get("post", "")
          paragraphs = [p for p in post.split("\n\n") if p.strip()]
          words = len(post.split())
          if not 95 <= words <= 110 or len(paragraphs) != 3:
              raise SystemExit(f"Caption must have 95-110 words in exactly three paragraphs; got {words} words and {len(paragraphs)} paragraphs.")
          slides = content.get("slides", [])
          if len(slides) != 5 or len(content.get("hashtags", [])) < 3:
              raise SystemExit("Exactly five slides and at least three hashtags are required.")
          if topic == "Binary Search in C++: Iterative and Recursive":
              if not slides[1].get("code_lines") or not slides[2].get("code_lines") or not slides[3].get("code_lines"):
                  raise SystemExit("DSA video must show a worked trace, iterative C++ code, and recursive C++ code.")
              trace = "\\n".join(slides[1]["code_lines"])
              iterative = "\\n".join(slides[2]["code_lines"])
              recursive = "\\n".join(slides[3]["code_lines"])
              for required in ("a[3] = 7", "low = 4", "a[5] = 11", "high = 4", "a[4] = 9"):
                  if required not in trace:
                      raise SystemExit(f"Worked binary-search trace is missing: {required}")
              if "low + (high - low) / 2" not in iterative or "low <= high" not in iterative:
                  raise SystemExit("Iterative code is missing the safe midpoint or inclusive loop condition.")
              if "l > r" not in recursive or "m - 1" not in recursive:
                  raise SystemExit("Recursive code is missing the empty-range base case or shrinking boundary.")
          else:
              java_code = "\\n".join(
                  line for slide in slides for line in slide.get("code_lines", [])
              )
              for required in ("Animal animal = new Dog();", "animal.sound();", "@Override"):
                  if required not in java_code:
                      raise SystemExit(f"Java polymorphism visual is missing {required!r}.")
          metadata = json.loads(Path("video_metadata.json").read_text(encoding="utf-8"))
          streams = metadata.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          duration = float(metadata.get("format", {}).get("duration", 0))
          formats = metadata.get("format", {}).get("format_name", "").split(",")
          size = Path("linkedin_video.mp4").stat().st_size
          if not video or video.get("codec_name") != "h264" or video.get("width") != 1080 or video.get("height") != 1350:
              raise SystemExit("Video must be 1080x1350 H.264.")
          if video.get("r_frame_rate") != "24/1" or video.get("pix_fmt") != "yuv420p" or video.get("profile") != "High" or video.get("level") != 42:
              raise SystemExit("Video encoding differs from the required format.")
          if "mp4" not in formats or any(s.get("codec_type") == "audio" for s in streams):
              raise SystemExit("Video must be a silent MP4.")
          try:
              bitrate = int(video.get("bit_rate") or 0)
          except (TypeError, ValueError):
              bitrate = 0
          if not 25_000_000 <= bitrate <= 31_000_000 or not 50_000_000 <= size <= 70_000_000 or not 15.5 <= duration <= 16.2:
              raise SystemExit(f"Video outside accepted format: bitrate={bitrate}, size={size}, duration={duration:.2f}s.")
          print(f"Validated {words}-word caption and {duration:.2f}s video ({size:,} bytes, {bitrate:,} bps).")
          PY

      - name: Publish custom post to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "true"
          PUBLISH_INTENT: extra
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
          PUBLISH_TOPIC_DAY: ${{ contains(github.event.issue.body, 'CUSTOM_POST_TOPIC=java-polymorphism') && '100' || '99' }}
          PUBLISH_CUSTOM_TOPIC: ${{ contains(github.event.issue.body, 'CUSTOM_POST_TOPIC=java-polymorphism') && 'java-polymorphism' || 'binary-search-cpp' }}
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py

      - name: Confirm publication in the issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const oldBody = issue.body || "";
            const newBody = oldBody.split("REQUEST_STATUS: OPEN").join("REQUEST_STATUS: PUBLISHED");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "LinkedIn confirmed the C++ binary-search video post was created, and the publication ledger was updated."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: newBody,
              state: "closed"
            });

      - name: Report failure without blind retry
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "The custom LinkedIn post workflow failed before confirmed completion. Review this Actions run and published-ledger.json before retrying; do not retry an uncertain upload blindly. Run: https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
            });
