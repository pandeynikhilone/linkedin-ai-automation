name: Test LinkedIn Video Upload

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing the linkedin-video-content artifact"
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  upload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download generated video artifact
        uses: actions/download-artifact@v4
        with:
          name: linkedin-video-content
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Check downloaded video
        run: |
          test -s linkedin_video.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json linkedin_video.mp4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test LinkedIn video upload only
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/test_linkedin_video_upload.py
