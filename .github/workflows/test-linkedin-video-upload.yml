
name: Test LinkedIn Video Upload

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful run ID containing linkedin-content-preview"
        type: string
        required: true
        default: "38040855748"

permissions:
  contents: read
  actions: read

jobs:
  upload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download existing content artifact
        uses: actions/download-artifact@v5
        with:
          name: linkedin-content-preview
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Check downloaded files
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          echo "Content and video files are present."

      - name: Install dependency
        run: python -m pip install requests

      - name: Test LinkedIn video upload only
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_VIDEO_API_VERSION: "202609"
        run: python src/test_linkedin_video_upload.py
