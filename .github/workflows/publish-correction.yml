name: Publish Corrected LinkedIn Post

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: linkedin-correction-publication
  cancel-in-progress: false

jobs:
  correction-preflight:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Publish corrected Day ') &&
      endsWith(github.event.issue.title, ' LinkedIn post now') &&
      contains(github.event.issue.body, 'PUBLISH_CORRECTION_DAY=')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
      topic_day: ${{ steps.request.outputs.topic_day }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate requested correction and confirm today's original post
        id: request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          title = os.getenv("ISSUE_TITLE", "")
          body = os.getenv("ISSUE_BODY", "")
          title_match = re.fullmatch(r"Publish corrected Day (\d{1,2}) LinkedIn post now", title)
          marker_match = re.search(r"^PUBLISH_CORRECTION_DAY=(\d{1,2})$", body, re.MULTILINE)
          if not title_match or not marker_match:
              raise SystemExit("Use the exact correction title and PUBLISH_CORRECTION_DAY marker.")
          title_day = int(title_match.group(1))
          marker_day = int(marker_match.group(1))
          if title_day != marker_day or not 1 <= title_day <= 30:
              raise SystemExit("The correction day must match in the title and marker, between 1 and 30.")

          plan = json.loads(Path("content-plan.json").read_text(encoding="utf-8"))
          ledger = json.loads(Path("published-ledger.json").read_text(encoding="utf-8"))
          topics = plan.get("topics", [])
          dates = ledger.get("dates", {})
          day_to_topic = {int(item["day"]): str(item["topic"]) for item in topics}
          if title_day not in day_to_topic or not isinstance(dates, dict):
              raise SystemExit("The correction day is not present in the plan or the ledger is malformed.")
          requested_topic = day_to_topic[title_day]

          timezone = ZoneInfo("Asia/Kolkata")
          today = datetime.now(timezone).date().isoformat()
          original_today = []
          latest_plan_topic = None
          latest_order = None
          for key, record in dates.items():
              if not isinstance(record, dict) or record.get("status") != "published":
                  continue
              topic = str(record.get("topic") or "")
              published_at = record.get("published_at") or record.get("started_at") or record.get("recorded_at") or str(key)[:10]
              try:
                  stamp = datetime.fromisoformat(str(published_at).replace("Z", "+00:00"))
              except (TypeError, ValueError):
                  continue
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=timezone)
              local_day = stamp.astimezone(timezone).date().isoformat()
              if local_day == today and topic == requested_topic and "-correction-" not in key:
                  original_today.append((key, record))
              topic_day = next((day for day, name in day_to_topic.items() if name == topic), None)
              if topic_day is not None:
                  order = (stamp.timestamp(), str(key))
                  if latest_order is None or order > latest_order:
                      latest_order = order
                      latest_plan_topic = topic_day

          if not original_today:
              raise SystemExit("A correction is allowed only for a confirmed original post of this same topic today.")
          if latest_plan_topic != title_day:
              raise SystemExit(
                  f"Only the most recently published plan topic can be corrected; latest is Day {latest_plan_topic}, "
                  f"requested Day {title_day}."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"topic_day={title_day}\n")
          print(f"Correction preflight passed for today's confirmed Day {title_day} post.")
          PY

      - name: Confirm the one-correction limit and check today's slot
        id: slot
        env:
          PUBLISH_INTENT: correction
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
        run: python3 src/check_publication_slot.py

  publish-corrected:
    needs: correction-preflight
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Publish corrected Day ') &&
      endsWith(github.event.issue.title, ' LinkedIn post now') &&
      contains(github.event.issue.body, 'PUBLISH_CORRECTION_DAY=') &&
      needs.correction-preflight.result == 'success' &&
      needs.correction-preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate consistently formatted caption and five slides
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          PUBLISH_TOPIC_DAY: ${{ needs.correction-preflight.outputs.topic_day }}
          PUBLISH_FIXED_DAY4_TEMPLATE: ${{ needs.correction-preflight.outputs.topic_day == '4' && 'true' || 'false' }}
        run: python src/generate_content.py

      - name: Render the standard five-slide portrait video
        run: python src/create_video.py

      - name: Validate caption structure, slide text, and video encoding
        env:
          REQUESTED_TOPIC_DAY: ${{ needs.correction-preflight.outputs.topic_day }}
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,pix_fmt,profile,level,bit_rate -show_entries format=duration,format_name -of json linkedin_video.mp4 > video_metadata.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          day = int(os.environ["REQUESTED_TOPIC_DAY"])
          plan = json.loads(Path("content-plan.json").read_text(encoding="utf-8"))
          data = json.loads(Path("content.json").read_text(encoding="utf-8"))
          expected_topic = next((item["topic"] for item in plan["topics"] if int(item["day"]) == day), None)
          if not expected_topic or data.get("topic") != expected_topic:
              raise SystemExit(f"Topic mismatch for Day {day}: expected {expected_topic!r}.")
          post = str(data.get("post") or "").strip()
          paragraphs = [part.strip() for part in post.split("\n\n") if part.strip()]
          words = len(post.split())
          if not 70 <= words <= 95 or len(paragraphs) != 3:
              raise SystemExit(f"Caption must be 70-95 words in exactly three paragraphs; got {words} words and {len(paragraphs)} paragraphs.")
          if "#" in post or any(part.startswith(("#", "- ", "* ", "• ")) for part in paragraphs):
              raise SystemExit("Caption must use plain paragraphs; hashtags are appended separately.")
          if not isinstance(data.get("hashtags"), list) or len(data["hashtags"]) < 3:
              raise SystemExit("At least three relevant hashtags are required.")
          slides = data.get("slides")
          if not isinstance(slides, list) or len(slides) != 5:
              raise SystemExit("Exactly five slides are required.")
          for index, slide in enumerate(slides, 1):
              title_words = len(str(slide.get("title", "")).split())
              body_words = len(str(slide.get("body", "")).split())
              if not 3 <= title_words <= 7 or not 5 <= body_words <= 18:
                  raise SystemExit(f"Slide {index} copy is outside the standard title/body lengths.")

          metadata = json.loads(Path("video_metadata.json").read_text(encoding="utf-8"))
          streams = metadata.get("streams", [])
          video = next((item for item in streams if item.get("codec_type") == "video"), None)
          duration = float(metadata.get("format", {}).get("duration", 0))
          formats = str(metadata.get("format", {}).get("format_name", "")).split(",")
          size = Path("linkedin_video.mp4").stat().st_size
          try:
              bitrate = int(video.get("bit_rate") or 0) if video else 0
          except (TypeError, ValueError):
              bitrate = 0
          if not video or video.get("codec_name") != "h264" or video.get("width") != 1080 or video.get("height") != 1350:
              raise SystemExit("Video must be H.264 at 1080x1350 portrait.")
          if video.get("r_frame_rate") != "24/1" or video.get("pix_fmt") != "yuv420p" or video.get("profile") != "High" or video.get("level") != 42:
              raise SystemExit("Video encoding must remain H.264 High Profile Level 4.2, 24 fps, yuv420p.")
          if "mp4" not in formats or any(item.get("codec_type") == "audio" for item in streams):
              raise SystemExit("Video must be a silent MP4.")
          if not 15.5 <= duration <= 16.2 or not 50_000_000 <= size <= 70_000_000 or not 25_000_000 <= bitrate <= 31_000_000:
              raise SystemExit(f"Video falls outside the standard format: duration={duration:.2f}s, size={size:,}, bitrate={bitrate}.")
          print(f"Validated Day {day}: {words}-word three-paragraph caption and standard five-slide 1080x1350 MP4.")
          PY

      - name: Publish corrected video post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "true"
          PUBLISH_INTENT: correction
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
          PUBLISH_TOPIC_DAY: ${{ needs.correction-preflight.outputs.topic_day }}
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py

      - name: Mark corrected post confirmed and close request
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const updatedBody = (issue.body || "").replace("REQUEST_STATUS: OPEN", "REQUEST_STATUS: PUBLISHED");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "LinkedIn confirmed the corrected video-post creation. The corrected publication is recorded in the ledger; the dashboard will refresh shortly. Run: https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: updatedBody,
              state: "closed"
            });

  close-skipped-request:
    needs: [correction-preflight, publish-corrected]
    if: >-
      always() &&
      github.event.issue.user.login == github.repository_owner &&
      needs.correction-preflight.result == 'success' &&
      needs.correction-preflight.outputs.should_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Record protected-slot skip
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const updatedBody = (issue.body || "").replace("REQUEST_STATUS: OPEN", "REQUEST_STATUS: SKIPPED");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "No corrected post was generated or published because today's correction slot was already used or requires review. Inspect the ledger before taking further action."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: updatedBody,
              state: "closed"
            });

  close-failed-request:
    needs: [correction-preflight, publish-corrected]
    if: >-
      always() &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Publish corrected Day ') &&
      endsWith(github.event.issue.title, ' LinkedIn post now') &&
      contains(github.event.issue.body, 'PUBLISH_CORRECTION_DAY=') &&
      (needs.correction-preflight.result == 'failure' || needs.publish-corrected.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark the failed correction request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const updatedBody = (issue.body || "").replace("REQUEST_STATUS: OPEN", "REQUEST_STATUS: FAILED");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "The corrected post did not complete successfully. Inspect the Actions run and publication ledger before retrying; do not retry an uncertain LinkedIn upload blindly. Run: https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: updatedBody,
              state: "closed"
            });
