name: Test LinkedIn Image Upload

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing the linkedin-illustrated-content artifact"
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  upload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download illustrated content artifact
        uses: actions/download-artifact@v5
        with:
          name: linkedin-illustrated-content
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Check downloaded files
        run: |
          test -s content.json
          test -s linkedin_image.jpg
          echo "Post content and square image are present."

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test LinkedIn image upload only
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_IMAGES_API_VERSION: "202609"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/test_linkedin_image_upload.py
