name: Republish Corrected LinkedIn Video Post

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: linkedin-publishing-now
  cancel-in-progress: false

jobs:
  publication-preflight:
    permissions:
      contents: read
      issues: read
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'Republish corrected LinkedIn video post' && contains(github.event.issue.body, 'PUBLISH_CORRECTED_VIDEO')
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check today's publication slot before generation
        id: slot
        env:
          PUBLISH_INTENT: correction
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
        run: python3 src/check_publication_slot.py

  publish-on-request:
    permissions:
      contents: write
      issues: write
    needs: publication-preflight
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'Republish corrected LinkedIn video post' && contains(github.event.issue.body, 'PUBLISH_CORRECTED_VIDEO') && needs.publication-preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate today's source-grounded post and slides
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python src/generate_content.py

      - name: Render five-slide animated video
        run: python src/create_video.py

      - name: Validate and save generated content
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 linkedin_video.mp4

      - name: Publish one-off video post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "true"
          PUBLISH_INTENT: correction
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py

      - name: Close request after confirmed publication
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "LinkedIn confirmed creation of the corrected video post. The correction request is complete."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
