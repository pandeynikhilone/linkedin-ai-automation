name: LinkedIn AI Illustrated Content and Publishing

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish publicly to LinkedIn?"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: linkedin-publishing
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate concise LinkedIn post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python src/generate_content.py

      - name: Generate one hand-drawn-style illustration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
          GEMINI_IMAGE_SIZE: "2K"
        run: python src/create_illustration.py

      - name: Save post and image artifact
        uses: actions/upload-artifact@v7
        with:
          name: linkedin-illustrated-content
          path: |
            content.json
            linkedin_image.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Publish or preview the post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: ${{ inputs.publish }}
          LINKEDIN_IMAGES_API_VERSION: "202609"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
