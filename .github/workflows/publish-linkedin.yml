name: LinkedIn AI Content and Publishing

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish publicly to LinkedIn?"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: linkedin-publishing
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate LinkedIn content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python src/generate_content.py

      - name: Create animated video
        run: python src/create_video.py

      - name: Upload preview files
        uses: actions/upload-artifact@v7
        with:
          name: linkedin-content-preview
          path: |
            content.json
            linkedin_video.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Run LinkedIn publisher
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: ${{ inputs.publish }}
          LINKEDIN_VIDEO_API_VERSION: "202609"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
