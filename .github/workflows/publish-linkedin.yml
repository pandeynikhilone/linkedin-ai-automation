name: LinkedIn AI Content and Video Publishing

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish publicly to LinkedIn?"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: linkedin-publishing
  cancel-in-progress: false

jobs:
  generate-and-publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate LinkedIn post and five slides
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python src/generate_content.py

      - name: Check whether a genuine website screenshot is needed
        id: website_capture
        run: |
          python - <<'PY'
          import json
          import os

          with open("content.json", encoding="utf-8") as source:
              data = json.load(source)
          needed = any(
              isinstance(slide, dict) and slide.get("visual_type") == "website"
              for slide in data.get("slides", [])
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needed={'true' if needed else 'false'}\\n")
          print("A genuine website capture is required." if needed else "No website screenshot needed.")
          PY

      - name: Install Chromium for genuine TruLoop site capture
        if: steps.website_capture.outputs.needed == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Capture the deployed TruLoop homepage for video visuals
        if: steps.website_capture.outputs.needed == 'true'
        run: python src/capture_truloop_site.py

      - name: Render animated video
        run: python src/create_video.py

      - name: Save post and video artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-video-content
          path: |
            content.json
            linkedin_video.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Publish or preview
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: ${{ inputs.publish }}
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
