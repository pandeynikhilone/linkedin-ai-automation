name: Preview Custom LinkedIn DSA Post

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  preview:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == 'Preview Custom LinkedIn Post now' &&
      contains(github.event.issue.body, 'CUSTOM_POST_TOPIC=binary-search-cpp-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate draft only, never publish
        env:
          PUBLISH_CUSTOM_TOPIC: binary-search-cpp
        run: python src/generate_content.py

      - name: Render draft video
        run: python src/create_video.py

      - name: Validate draft consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("content.json").read_text(encoding="utf-8"))
          post = data["post"]
          words = len(post.split())
          if not 95 <= words <= 110 or len([p for p in post.split("\n\n") if p.strip()]) != 3:
              raise SystemExit(f"Draft caption must have 95-110 words in three paragraphs, got {words}.")
          slides = data["slides"]
          if len(slides) != 5:
              raise SystemExit("Draft must contain exactly five slides.")
          if not all(slides[i].get("code_lines") for i in (1, 2, 3)):
              raise SystemExit("Trace, iterative code, and recursive code must be shown explicitly.")
          trace = "\n".join(slides[1]["code_lines"])
          iterative = "\n".join(slides[2]["code_lines"])
          recursive = "\n".join(slides[3]["code_lines"])
          for term in ("a[3] = 7", "low = 4", "a[5] = 11", "high = 4", "a[4] = 9"):
              if term not in trace:
                  raise SystemExit(f"Trace inconsistency: missing {term}")
          if "low + (high - low) / 2" not in iterative or "low <= high" not in iterative:
              raise SystemExit("Iterative implementation failed its consistency checks.")
          if "l > r" not in recursive or "m - 1" not in recursive:
              raise SystemExit("Recursive implementation failed its consistency checks.")
          print(f"PASS: {words}-word caption, trace, iterative/recursive code, and five slides.")
          print("\nCAPTION:\n" + post)
          for i, slide in enumerate(slides, 1):
              print(f"\nSLIDE {i}: {slide['title']}\n{slide['body']}")
              for line in slide.get("code_lines", []):
                  print("  " + line)
          PY

      - name: Upload draft for visual review
        uses: actions/upload-artifact@v4
        with:
          name: binary-search-dsa-preview
          path: |
            content.json
            linkedin_video.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Report preview, without publishing
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('content.json', 'utf8'));
            const slides = data.slides.map((s, i) => {
              const code = (s.code_lines || []).join('\n');
              return '**Slide ' + (i + 1) + ': ' + s.title + '**\n' + s.body + (code ? '\n\n' + code : '');
            }).join('\n\n');
            const body = '## Draft preview only\n\n**Not published to LinkedIn.** Download the binary-search-dsa-preview artifact from this Actions run to review the rendered MP4.\n\n### Caption\n\n' + data.post + '\n\n' + data.hashtags.map(tag => '#' + tag).join(' ') + '\n\n### Slide-by-slide content\n\n' + slides + '\n\nPlease review the actual video and this content before requesting publication.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });
