name: Publish Selected LinkedIn Plan Day

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: read

concurrency:
  group: linkedin-plan-day-publication
  cancel-in-progress: false

jobs:
  publication-preflight:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Publish Day ') &&
      endsWith(github.event.issue.title, ' LinkedIn post now') &&
      contains(github.event.issue.body, 'PUBLISH_PLAN_DAY=')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
      topic_day: ${{ steps.request.outputs.topic_day }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate requested content-plan day
        id: request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import re

          title = os.getenv("ISSUE_TITLE", "")
          body = os.getenv("ISSUE_BODY", "")
          title_match = re.fullmatch(r"Publish Day (\d{1,2}) LinkedIn post now", title)
          marker_match = re.search(r"^PUBLISH_PLAN_DAY=(\d{1,2})$", body, re.MULTILINE)
          if not title_match or not marker_match:
              raise SystemExit("The publish request must have a valid title and PUBLISH_PLAN_DAY marker.")
          title_day = int(title_match.group(1))
          marker_day = int(marker_match.group(1))
          if title_day != marker_day or not 1 <= title_day <= 30:
              raise SystemExit("The requested day in the issue title and body must match and be from 1 to 30.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("topic_day=" + str(title_day) + "\n")
          print("Validated explicit request for content-plan Day " + str(title_day) + ".")
          PY

      - name: Verify request follows the next topic in sequence
        env:
          REQUESTED_TOPIC_DAY: ${{ steps.request.outputs.topic_day }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          plan = json.loads(Path("content-plan.json").read_text(encoding="utf-8"))
          ledger = json.loads(Path("published-ledger.json").read_text(encoding="utf-8"))
          topics = plan.get("topics", [])
          dates = ledger.get("dates", {})
          if not topics or not isinstance(dates, dict):
              raise SystemExit("The content plan or publication ledger is not valid.")
          topic_days = {
              str(item["topic"]): int(item.get("day", index + 1))
              for index, item in enumerate(topics)
          }
          records = []
          for key, record in dates.items():
              if not isinstance(record, dict) or record.get("status") != "published":
                  continue
              topic = str(record.get("topic") or "")
              if topic not in topic_days:
                  continue
              stamp_text = record.get("published_at") or record.get("started_at") or record.get("recorded_at") or str(key)[:10]
              try:
                  stamp = datetime.fromisoformat(str(stamp_text).replace("Z", "+00:00"))
              except (TypeError, ValueError):
                  stamp = datetime.fromisoformat(str(key)[:10])
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=ZoneInfo("Asia/Kolkata"))
              records.append((stamp.timestamp(), str(key), topic_days[topic]))
          if records:
              latest_day = max(records, key=lambda item: (item[0], item[1]))[2]
              expected_day = latest_day % len(topics) + 1
          else:
              expected_day = int(topics[0].get("day", 1))
          requested_day = int(os.environ["REQUESTED_TOPIC_DAY"])
          if requested_day != expected_day:
              raise SystemExit(
                  f"Only the next plan topic may be manually published: expected Day {expected_day}, "
                  f"received Day {requested_day}. This protects the next 04:00 IST scheduled topic."
              )
          print(f"Sequence check passed: Day {requested_day} is next. The daily 04:00 IST schedule remains unchanged.")
          PY

      - name: Check today's publication slot before generation
        id: slot
        env:
          PUBLISH_INTENT: request
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
        run: python3 src/check_publication_slot.py

  publish-selected-day:
    needs: publication-preflight
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Publish Day ') &&
      endsWith(github.event.issue.title, ' LinkedIn post now') &&
      contains(github.event.issue.body, 'PUBLISH_PLAN_DAY=') &&
      needs.publication-preflight.result == 'success' &&
      needs.publication-preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate the requested source-grounded post and slides
        timeout-minutes: 8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          PUBLISH_TOPIC_DAY: ${{ needs.publication-preflight.outputs.topic_day }}
        run: python src/generate_content.py

      - name: Check whether a genuine website screenshot is needed
        id: website_capture
        run: |
          python - <<'PY'
          import json
          import os

          with open("content.json", encoding="utf-8") as source:
              data = json.load(source)
          needed = any(
              isinstance(slide, dict) and slide.get("visual_type") == "website"
              for slide in data.get("slides", [])
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needed={'true' if needed else 'false'}\n")
          print("A genuine website capture is required." if needed else "No website screenshot needed.")
          PY

      - name: Install Chromium for genuine TruLoop site capture
        if: steps.website_capture.outputs.needed == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Capture the deployed TruLoop homepage for video visuals
        if: steps.website_capture.outputs.needed == 'true'
        run: python src/capture_truloop_site.py

      - name: Render five-slide animated video
        run: python src/create_video.py

      - name: Validate requested topic, post, and video format
        env:
          REQUESTED_TOPIC_DAY: ${{ needs.publication-preflight.outputs.topic_day }}
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,pix_fmt,profile,level,bit_rate -show_entries format=duration,format_name -of json linkedin_video.mp4 > video_metadata.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          topic_day = int(os.environ["REQUESTED_TOPIC_DAY"])
          plan = json.loads(Path("content-plan.json").read_text(encoding="utf-8"))
          content = json.loads(Path("content.json").read_text(encoding="utf-8"))
          expected = next((row["topic"] for row in plan["topics"] if int(row["day"]) == topic_day), None)
          if not expected or content.get("topic") != expected:
              raise SystemExit(f"Requested Day {topic_day} topic mismatch: expected {expected!r}, got {content.get('topic')!r}.")
          if not content.get("post") or not content.get("video_title") or not isinstance(content.get("slides"), list) or len(content["slides"]) != 5:
              raise SystemExit("Post text, video title, and exactly five slides are required.")
          if len(content["post"].split()) > 110:
              raise SystemExit("Post body exceeds 110 words.")
          metadata = json.loads(Path("video_metadata.json").read_text(encoding="utf-8"))
          streams = metadata.get("streams", [])
          video = next((stream for stream in streams if stream.get("codec_type") == "video"), None)
          duration = float(metadata.get("format", {}).get("duration", 0))
          formats = metadata.get("format", {}).get("format_name", "").split(",")
          size = Path("linkedin_video.mp4").stat().st_size
          if not video or video.get("codec_name") != "h264" or video.get("width") != 1080 or video.get("height") != 1350:
              raise SystemExit("Video must be 1080x1350 H.264.")
          if video.get("r_frame_rate") != "24/1" or video.get("pix_fmt") != "yuv420p" or video.get("profile") != "High" or video.get("level") != 42:
              raise SystemExit("Video encoding differs from the required High Profile Level 4.2 format.")
          if "mp4" not in formats or any(stream.get("codec_type") == "audio" for stream in streams):
              raise SystemExit("Video must remain a silent MP4.")
          try:
              bitrate = int(video.get("bit_rate") or 0)
          except (TypeError, ValueError):
              bitrate = 0
          if not 25_000_000 <= bitrate <= 31_000_000 or not 50_000_000 <= size <= 70_000_000 or not 15.5 <= duration <= 16.2:
              raise SystemExit(f"Video is outside the accepted format: bitrate={bitrate}, size={size}, duration={duration:.2f}s.")
          print(f"Day {topic_day} validation passed: {duration:.2f}s, {size:,} bytes, {bitrate:,} bps.")
          PY

      - name: Publish requested video post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "true"
          PUBLISH_INTENT: request
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
          PUBLISH_TOPIC_DAY: ${{ needs.publication-preflight.outputs.topic_day }}
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py

      - name: Mark request confirmed and close it
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const oldBody = issue.body || "";
            const newBody = oldBody.split("REQUEST_STATUS: OPEN").join("REQUEST_STATUS: PUBLISHED");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "LinkedIn confirmed the video-post creation. The publication ledger has been updated; the dashboard will refresh shortly."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: newBody,
              state: "closed"
            });

  close-skipped-request:
    needs: [publication-preflight, publish-selected-day]
    if: >-
      always() &&
      github.event.issue.user.login == github.repository_owner &&
      needs.publication-preflight.result == 'success' &&
      needs.publication-preflight.outputs.should_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Record protected-slot skip
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const oldBody = issue.body || "";
            const newBody = oldBody.split("REQUEST_STATUS: OPEN").join("REQUEST_STATUS: SKIPPED");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "No post was generated or published because today's publication slot is already used or requires review. See the workflow logs before trying again."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: newBody,
              state: "closed"
            });

  close-failed-request:
    needs: [publication-preflight, publish-selected-day]
    if: >-
      always() &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Publish Day ') &&
      endsWith(github.event.issue.title, ' LinkedIn post now') &&
      contains(github.event.issue.body, 'PUBLISH_PLAN_DAY=') &&
      (needs.publication-preflight.result == 'failure' || needs.publish-selected-day.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark the failed request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const oldBody = issue.body || "";
            const newBody = oldBody.split("REQUEST_STATUS: OPEN").join("REQUEST_STATUS: FAILED");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: "The publish request did not complete. Review the Actions run and publication ledger before retrying; do not retry an uncertain LinkedIn upload blindly. Run: https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: newBody,
              state: "closed"
            });
