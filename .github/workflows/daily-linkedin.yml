name: Daily LinkedIn Career Video

on:
  schedule:
    # Keep the existing daily time: 9:37 AM India time.
    # GitHub Actions schedule uses UTC: 04:07 UTC = 09:37 Asia/Kolkata.
    - cron: "7 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-publishing
  cancel-in-progress: false

jobs:
  publication-preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check today's publication slot before generation
        id: slot
        env:
          PUBLISH_INTENT: ${{ github.event_name == 'workflow_dispatch' && 'preview' || 'scheduled' }}
        run: python3 src/check_publication_slot.py

  generate-video-and-publish:
    needs: publication-preflight
    if: needs.publication-preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version
          ffprobe -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate source-grounded LinkedIn post and five slides
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python src/generate_content.py

      - name: Render animated slides to MP4
        run: python src/create_video.py

      - name: Validate post and rendered video
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          video_size = Path("linkedin_video.mp4").stat().st_size
          if not 450_000_000 <= video_size <= 490_000_000:
              raise SystemExit(f"Video size must be 450-490 MB for the configured high-bitrate target; got {video_size:,} bytes.")
          data = json.loads(Path("content.json").read_text(encoding="utf-8"))
          if not data.get("topic") or not data.get("post") or not data.get("video_title"):
              raise SystemExit("Topic, post, and video title are required.")
          if len(data["slides"]) != 5:
              raise SystemExit("Exactly five slides are required.")
          if len(data["post"].split()) > 110:
              raise SystemExit("Post body exceeds 110 words.")
          print("Validated concise post and five-slide video content.")
          PY
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -show_entries format=duration,format_name -of json linkedin_video.mp4

      - name: Save preview artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-video-content
          path: |
            content.json
            linkedin_video.mp4
          if-no-files-found: error
          retention-days: 1

      - name: Publish scheduled video post automatically
        if: github.event_name == 'schedule'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "true"
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py

      - name: Preview only when run manually
        if: github.event_name == 'workflow_dispatch'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "false"
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
