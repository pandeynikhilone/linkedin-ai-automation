name: Daily LinkedIn Career Content

on:
  schedule:
    # 9:37 AM India time, every day.
    - cron: "37 9 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the other publisher workflows so two workflows cannot publish
# concurrently and race against the publication ledger.
concurrency:
  group: linkedin-publishing
  cancel-in-progress: false

jobs:
  generate-video-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate daily career content (with transient-error retries)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python src/generate_content.py

      - name: Render animated video
        run: python src/create_video.py

      - name: Validate and preview assets
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null
          echo "Generated post and video are present."

      - name: Save content artifact
        uses: actions/upload-artifact@v7
        with:
          name: linkedin-content-preview
          path: |
            content.json
            linkedin_video.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Publish scheduled daily post
        if: github.event_name == 'schedule'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "true"
          LINKEDIN_VIDEO_API_VERSION: "202609"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py

      - name: Preview only when run manually
        if: github.event_name == 'workflow_dispatch'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "false"
          LINKEDIN_VIDEO_API_VERSION: "202609"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
