name: Daily LinkedIn Illustrated Career Post

on:
  schedule:
    # 9:37 AM India time, every day.
    - cron: "37 9 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-publishing
  cancel-in-progress: false

jobs:
  generate-image-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate concise LinkedIn post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python src/generate_content.py

      - name: Generate one hand-drawn-style square illustration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
          GEMINI_IMAGE_SIZE: "2K"
        run: python src/create_illustration.py

      - name: Validate post and image
        run: |
          test -s content.json
          test -s linkedin_image.jpg
          python -m json.tool content.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          data = json.loads(Path("content.json").read_text(encoding="utf-8"))
          if not data.get("post") or not data.get("illustration_brief") or not data.get("source_facts"):
              raise SystemExit("Required post content is missing.")
          if len(data["post"].split()) > 110:
              raise SystemExit("Post body is longer than 110 words.")
          with Image.open("linkedin_image.jpg") as image:
              if image.format != "JPEG" or image.size != (2048, 2048):
                  raise SystemExit("Illustration must be a 2048x2048 square JPEG.")
          print("Validated concise LinkedIn copy and square illustration.")
          PY

      - name: Save post and illustration preview
        uses: actions/upload-artifact@v7
        with:
          name: linkedin-illustrated-content
          path: |
            content.json
            linkedin_image.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Publish scheduled post automatically
        if: github.event_name == 'schedule'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "true"
          LINKEDIN_IMAGES_API_VERSION: "202609"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py

      - name: Preview only when run manually
        if: github.event_name == 'workflow_dispatch'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "false"
          LINKEDIN_IMAGES_API_VERSION: "202609"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
