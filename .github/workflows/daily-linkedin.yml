name: LinkedIn Developer Story Video

on:
  schedule:
    # Two focused posts each week: Tuesday and Friday at 09:00 IST.
    # GitHub Actions cron uses UTC. 03:30 UTC = 09:00 IST; final recovery run 08:30 UTC = 14:00 IST.
    - cron: "30 3-8 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-publishing
  cancel-in-progress: false

jobs:
  publication-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check today's publication slot before generation
        id: slot
        env:
          PUBLISH_INTENT: ${{ github.event_name == 'workflow_dispatch' && 'preview' || 'scheduled' }}
        run: python3 src/check_publication_slot.py

  generate-video-and-publish:
    needs: publication-preflight
    if: needs.publication-preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # This job needs write access only to persist the publication ledger on main.
    permissions:
      contents: write
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version
          ffprobe -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate source-grounded LinkedIn post and five slides
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python src/generate_content.py

      - name: Install Chromium for genuine TruLoop site capture
        run: python -m playwright install --with-deps chromium

      - name: Capture the deployed TruLoop homepage for video visuals
        run: python src/capture_truloop_site.py

      - name: Render animated slides to MP4
        run: python src/create_video.py

      - name: Validate post and rendered video
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,pix_fmt -show_entries format=duration,format_name -of json linkedin_video.mp4 > video_metadata.json
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("video_metadata.json").read_text(encoding="utf-8"))
          streams = metadata.get("streams", [])
          video = next((stream for stream in streams if stream.get("codec_type") == "video"), None)
          duration = float(metadata.get("format", {}).get("duration", 0))
          format_names = metadata.get("format", {}).get("format_name", "").split(",")
          video_size = Path("linkedin_video.mp4").stat().st_size

          if not video or video.get("codec_name") != "h264":
              raise SystemExit("Video must use the H.264 codec.")
          if video.get("width") != 1080 or video.get("height") != 1350:
              raise SystemExit("Video dimensions must remain 1080 x 1350 (4:5 portrait).")
          if video.get("r_frame_rate") != "24/1" or video.get("pix_fmt") != "yuv420p":
              raise SystemExit("Video must remain 24 fps with yuv420p pixel format.")
          if "mp4" not in format_names or any(stream.get("codec_type") == "audio" for stream in streams):
              raise SystemExit("Video must remain a silent MP4.")
          if not 15.5 <= duration <= 16.2:
              raise SystemExit(f"Video duration must remain approximately 15.9 seconds; got {duration:.2f}s.")
          if not 50_000_000 <= video_size <= 70_000_000:
              raise SystemExit(f"Video size must remain 50-70 MB for the configured 30 Mbps target; got {video_size:,} bytes.")

          data = json.loads(Path("content.json").read_text(encoding="utf-8"))
          if not data.get("topic") or not data.get("post") or not data.get("video_title"):
              raise SystemExit("Topic, post, and video title are required.")
          if not isinstance(data.get("slides"), list) or len(data["slides"]) != 5:
              raise SystemExit("Exactly five slides are required.")
          if len(data["post"].split()) > 110:
              raise SystemExit("Post body exceeds 110 words.")

          print(
              f"Validated LinkedIn post and five slides. Video: 1080x1350 H.264 MP4, "
              f"24 fps, {duration:.2f}s, {video_size:,} bytes, silent."
          )
          PY

      - name: Save preview artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-video-content
          path: |
            content.json
            linkedin_video.mp4
          if-no-files-found: error
          retention-days: 1

      - name: Publish scheduled video post automatically
        if: github.event_name == 'schedule'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "true"
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py

      - name: Preview only when run manually
        if: github.event_name == 'workflow_dispatch'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "false"
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
