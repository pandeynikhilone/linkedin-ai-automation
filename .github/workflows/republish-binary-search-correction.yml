name: Republish Corrected Binary Search LinkedIn Post

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: linkedin-correction-publication
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == 'Republish corrected Binary Search LinkedIn post now' &&
      contains(github.event.issue.body, 'PUBLISH_BINARY_SEARCH_CORRECTION')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check correction slot before generation
        id: slot
        env:
          PUBLISH_INTENT: correction
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
        run: python3 src/check_publication_slot.py

  publish:
    needs: preflight
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == 'Republish corrected Binary Search LinkedIn post now' &&
      contains(github.event.issue.body, 'PUBLISH_BINARY_SEARCH_CORRECTION') &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate the corrected Binary Search post
        env:
          PUBLISH_CUSTOM_TOPIC: binary-search-cpp
        run: python src/generate_content.py

      - name: Render the five-slide educational video
        run: python src/create_video.py

      - name: Validate caption, worked trace, code, and video encoding
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,pix_fmt,profile,level,bit_rate -show_entries format=duration,format_name -of json linkedin_video.mp4 > video_metadata.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("content.json").read_text(encoding="utf-8"))
          if data.get("topic") != "Binary Search in C++: Iterative and Recursive":
              raise SystemExit("Wrong topic in generated content.")
          post = data.get("post", "")
          words = len(post.split())
          paragraphs = [p for p in post.split("\n\n") if p.strip()]
          if not 95 <= words <= 110 or len(paragraphs) != 3:
              raise SystemExit(f"Caption must be 95-110 words in three paragraphs, got {words} words.")
          if any(mark in post for mark in chr(0x2014) + chr(0x2013)):
              raise SystemExit("Caption must not use em or en dashes.")
          slides = data.get("slides", [])
          if len(slides) != 5 or len(data.get("hashtags", [])) < 3:
              raise SystemExit("Exactly five slides and at least three hashtags are required.")
          if not all(slides[i].get("code_lines") for i in (1, 2, 3)):
              raise SystemExit("Video must show the worked trace, iterative code, and recursive code.")
          trace = "\n".join(slides[1]["code_lines"])
          iterative = "\n".join(slides[2]["code_lines"])
          recursive = "\n".join(slides[3]["code_lines"])
          for term in ("a[3] = 7", "low = 4", "a[5] = 11", "high = 4", "a[4] = 9"):
              if term not in trace:
                  raise SystemExit(f"Worked trace is missing {term}.")
          if "low + (high - low) / 2" not in iterative or "low <= high" not in iterative:
              raise SystemExit("Iterative implementation is missing a key correctness detail.")
          if "l > r" not in recursive or "m - 1" not in recursive:
              raise SystemExit("Recursive implementation is missing a base case or boundary update.")
          metadata = json.loads(Path("video_metadata.json").read_text(encoding="utf-8"))
          streams = metadata.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          duration = float(metadata.get("format", {}).get("duration", 0))
          formats = metadata.get("format", {}).get("format_name", "").split(",")
          size = Path("linkedin_video.mp4").stat().st_size
          if not video or video.get("codec_name") != "h264" or video.get("width") != 1080 or video.get("height") != 1350:
              raise SystemExit("Video must be 1080x1350 H.264.")
          if video.get("r_frame_rate") != "24/1" or video.get("pix_fmt") != "yuv420p" or video.get("profile") != "High" or video.get("level") != 42:
              raise SystemExit("Video encoding differs from the required format.")
          if "mp4" not in formats or any(s.get("codec_type") == "audio" for s in streams):
              raise SystemExit("Video must be a silent MP4.")
          try:
              bitrate = int(video.get("bit_rate") or 0)
          except (TypeError, ValueError):
              bitrate = 0
          if not 15.5 <= duration <= 16.2 or not 50_000_000 <= size <= 70_000_000:
              raise SystemExit(f"Video duration/size outside target: {duration:.2f}s, {size} bytes.")
          if not 25_000_000 <= bitrate <= 31_000_000:
              raise SystemExit(f"Video bitrate outside target: {bitrate} bps.")
          print(f"PASS: {words}-word caption; trace and both implementations; {duration:.2f}s, {size} bytes, {bitrate} bps.")
          PY

      - name: Publish corrected Binary Search video to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: "true"
          PUBLISH_INTENT: correction
          PUBLISH_REQUEST_ID: ${{ github.event.issue.number }}
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py

      - name: Confirm publication
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "LinkedIn confirmed creation of the corrected Binary Search in C++ video post. The publication ledger was updated."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
