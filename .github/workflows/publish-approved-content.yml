
name: Publish Approved LinkedIn Content

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of the reviewed content artifact"
        type: string
        required: true
        default: "38040855748"
      publish:
        description: "Publish this video and post publicly?"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download reviewed content
        uses: actions/download-artifact@v7
        with:
          name: linkedin-content-preview
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Validate downloaded files
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          echo "Reviewed content and video are present."

      - name: Install dependency
        run: python -m pip install requests

      - name: Preview or publish approved content
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: ${{ inputs.publish }}
          LINKEDIN_VIDEO_API_VERSION: "202609"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
