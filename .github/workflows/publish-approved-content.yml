name: Publish Reviewed LinkedIn Image Content

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing the linkedin-illustrated-content artifact"
        type: string
        required: true
      publish:
        description: "Publish this post publicly to LinkedIn?"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: linkedin-publishing
  cancel-in-progress: false

jobs:
  publish-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download reviewed post and image
        uses: actions/download-artifact@v7
        with:
          name: linkedin-illustrated-content
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Validate downloaded files
        run: |
          test -s content.json
          test -s linkedin_image.jpg
          python -m json.tool content.json > /dev/null

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Preview or publish reviewed image post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: ${{ inputs.publish }}
          LINKEDIN_IMAGES_API_VERSION: "202609"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
