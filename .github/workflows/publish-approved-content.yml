name: Publish Reviewed LinkedIn Video Content

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID containing the linkedin-video-content artifact"
        type: string
        required: true
      publish:
        description: "Publish this video post publicly?"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: linkedin-publishing
  cancel-in-progress: false

jobs:
  publish-reviewed:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download reviewed post and video
        uses: actions/download-artifact@v4
        with:
          name: linkedin-video-content
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Validate downloaded files
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Preview or publish reviewed video post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          PUBLISH_TO_LINKEDIN: ${{ inputs.publish }}
          LINKEDIN_VIDEO_API_VERSION: "202606"
          LINKEDIN_POSTS_API_VERSION: "202609"
        run: python src/publish_linkedin.py
