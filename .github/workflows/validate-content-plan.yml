name: Validate LinkedIn Content Plan

# Keep video-only publishing, date safety, and workflow permissions checked together.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - "src/generate_content.py"
      - "src/create_video.py"
      - "src/capture_truloop_site.py"
      - "src/publish_linkedin.py"
      - "src/test_linkedin_video_upload.py"
      - "src/create_illustration.py"
      - "src/test_linkedin_image_upload.py"
      - "content-plan.json"
      - "README.md"
      - "dashboard/**"
      - "scripts/build_dashboard_data.py"
      - ".github/workflows/daily-linkedin.yml"
      - ".github/workflows/validate-content-plan.yml"
      - ".github/workflows/**"
      - ".github/workflows/test-linkedin-image-upload.yml"
      - ".github/workflows/test-linkedin-video-upload.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate source and video-only publishing pipeline
        run: |
          python -m py_compile src/generate_content.py src/create_video.py src/capture_truloop_site.py src/publish_linkedin.py src/test_linkedin_video_upload.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          source = Path("src/generate_content.py").read_text(encoding="utf-8")
          plan_doc = json.loads(Path("content-plan.json").read_text(encoding="utf-8"))
          module = ast.parse(source)
          topic_plan = None
          for node in module.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "TOPIC_PLAN"
                  for target in node.targets
              ):
                  topic_plan = ast.literal_eval(node.value)
                  break

          if not isinstance(topic_plan, list) or len(topic_plan) != 30:
              raise SystemExit("Generator must contain exactly 30 source-grounded topics.")
          if len(plan_doc.get("topics", [])) != 30:
              raise SystemExit("content-plan.json must contain exactly 30 topics.")
          generator_titles = [entry.get("topic") for entry in topic_plan]
          public_titles = [entry.get("topic") for entry in plan_doc["topics"]]
          if generator_titles != public_titles:
              raise SystemExit("Topic order differs between the generator and content plan.")
          for number, entry in enumerate(topic_plan, 1):
              if not entry.get("facts") or not entry.get("angle"):
                  raise SystemExit(f"Topic {number} is missing source facts or an angle.")

          if '"video_title"' not in source or '"slides"' not in source:
              raise SystemExit("Generator must return a video title and slides.")
          if '"illustration_brief"' in source or "GEMINI_IMAGE" in source:
              raise SystemExit("Separate illustration-generation code remains in the generator.")
          renderer = Path("src/create_video.py").read_text(encoding="utf-8")
          capture = Path("src/capture_truloop_site.py").read_text(encoding="utf-8")
          if '"website"' not in source or "WEBSITE_SCREENSHOT" not in renderer or "page.screenshot" not in capture:
              raise SystemExit("TruLoop videos must embed a screenshot of the live site instead of regenerating the UI.")
          if "playwright" not in Path("requirements.txt").read_text(encoding="utf-8").lower():
              raise SystemExit("Playwright must be installed for deployed site capture.")
          for screen_asset in ("truloop_homepage.png", "truloop_products.png", "truloop_product_detail.png", "truloop_product_reviews.png", "truloop_submit_review.png"):
              if screen_asset not in capture:
                  raise SystemExit(f"Missing capture route for {screen_asset}.")
          if "context = (str(topic)" not in renderer:
              raise SystemExit("Live screenshot selection must depend on the topic and slide text.")
          if renderer.count('"name": "') < 6:
              raise SystemExit("The renderer must rotate across at least six visual style families.")

          renderer = Path("src/create_video.py").read_text(encoding="utf-8")
          publisher = Path("src/publish_linkedin.py").read_text(encoding="utf-8")
          if "linkedin_video.mp4" not in renderer or "ffmpeg" not in renderer:
              raise SystemExit("Animated MP4 rendering code is missing.")
          if "THEMES = [" not in renderer or "def theme_for_topic" not in renderer:
              raise SystemExit("Topic based visual art direction is missing from the renderer.")
          if not all(f'layout == "{name}"' in renderer for name in ("hero", "split", "evidence", "process", "editorial", "detail", "closing")):
              raise SystemExit("The renderer must support multiple distinct slide compositions.")
          if "visual_labels" not in renderer or "visual_labels" not in source:
              raise SystemExit("Slides must use context specific labels rather than decorative filler.")
          if "upload_video(" not in publisher or "urn:li:video:" not in publisher:
              raise SystemExit("LinkedIn video upload code is missing.")
          if "linkedin_image.jpg" in publisher or "upload_image(" in publisher or "IMAGES_URL" in publisher:
              raise SystemExit("A standalone image publishing path remains in the publisher.")

          workflow_paths = [
              ".github/workflows/daily-linkedin.yml",
              ".github/workflows/publish-linkedin.yml",
              ".github/workflows/publish-approved-content.yml",
              ".github/workflows/publish-now.yml",
              ".github/workflows/test-content.yml",
              ".github/workflows/test-linkedin-video-upload.yml",
          ]
          for filename in workflow_paths:
              workflow_text = Path(filename).read_text(encoding="utf-8")
              if "create_illustration.py" in workflow_text or "linkedin_image.jpg" in workflow_text or "GEMINI_IMAGE" in workflow_text:
                  raise SystemExit(f"Separate illustration generation remains in {filename}")

          forbidden = chr(0x2014)
          for filename in [
              "src/generate_content.py", "src/create_video.py",
              "src/publish_linkedin.py", "content-plan.json", "README.md",
          ]:
              if forbidden in Path(filename).read_text(encoding="utf-8"):
                  raise SystemExit(f"Forbidden em dash character found in {filename}")

          obsolete = [
              "src/create_illustration.py",
              "src/test_linkedin_image_upload.py",
              ".github/workflows/test-linkedin-image-upload.yml",
              "src/.github/workflows/publish-linkedin.yml",
          ]
          if any(Path(filename).exists() for filename in obsolete):
              raise SystemExit("Obsolete files remain in the repository.")

          daily = Path(".github/workflows/daily-linkedin.yml").read_text(encoding="utf-8")
          plan_doc = json.loads(Path("content-plan.json").read_text(encoding="utf-8"))
          readme = Path("README.md").read_text(encoding="utf-8")
          if 'PUBLISH_TO_LINKEDIN: "true"' not in daily:
              raise SystemExit("Scheduled publishing is not enabled.")
          # GitHub Actions cron is UTC: 03:30 UTC maps to 09:00 IST on Tuesday and Friday.
          if 'cron: "30 3-8 * * 2,5"' not in daily or "03:30 UTC = 09:00 IST" not in daily or "08:30 UTC = 14:00 IST" not in daily:
              raise SystemExit("Expected Tuesday and Friday publishing at 09:00 IST with hourly recovery through 14:00 IST.")
          if "Tuesday and Friday at 09:00 Asia/Kolkata" not in plan_doc.get("schedule", "") or "Tuesdays and Fridays at 09:00 Asia/Kolkata" not in readme:
              raise SystemExit("The README and content plan must document the twice weekly 09:00 IST schedule.")
          if "next_topic_index_from_ledger" not in source or "published-ledger.json" not in source:
              raise SystemExit("Scheduled topic progression must use the publication ledger.")
          if "most recently confirmed published plan topic" not in plan_doc.get("rule", ""):
              raise SystemExit("The content plan must document ledger-driven topic progression.")
          renderer = Path("src/create_video.py").read_text(encoding="utf-8")
          for setting in ['WIDTH = 1080', 'HEIGHT = 1350', 'FPS = 24', 'TARGET_BITRATE = "30M"', 'TARGET_MIN_BYTES = 50_000_000', 'TARGET_MAX_BYTES = 70_000_000']:
              if setting not in renderer:
                  raise SystemExit(f"Expected video format setting is missing: {setting}")
          print("Source, publishing schedule, and video-format checks passed.")
          PY

      - name: Test deterministic TruLoop fallback content
        run: |
          python - <<'PY'
          from src.generate_content import source_grounded_fallback

          topic = "Understanding what happens behind the TruLoop interface"
          content = source_grounded_fallback(topic)
          post = content["post"]
          words = len(post.split())
          paragraphs = [part for part in post.split("\\n\\n") if part.strip()]
          slides = content["slides"]

          if not 70 <= words <= 95 or len(paragraphs) != 3:
              raise SystemExit("TruLoop fallback caption must have 70-95 words in three paragraphs.")
          if len(slides) != 5:
              raise SystemExit("TruLoop fallback must contain exactly five slides.")
          if sum(slide.get("visual_type") == "website" for slide in slides) != 1:
              raise SystemExit("TruLoop fallback must include exactly one genuine website slide.")
          if slides[0].get("layout") != "hero" or slides[-1].get("layout") != "closing":
              raise SystemExit("TruLoop fallback must start with hero and end with closing.")
          if len({slide.get("layout") for slide in slides}) != 5:
              raise SystemExit("TruLoop fallback layouts must all be distinct.")
          for index, slide in enumerate(slides, 1):
              if not 3 <= len(slide.get("title", "").split()) <= 7:
                  raise SystemExit(f"Fallback slide {index} title must contain 3-7 words.")
              if not 5 <= len(slide.get("body", "").split()) <= 18:
                  raise SystemExit(f"Fallback slide {index} body must contain 5-18 words.")
              if not slide.get("visual_labels"):
                  raise SystemExit(f"Fallback slide {index} needs meaningful visual labels.")
          print("TruLoop fallback validation passed: 91-word caption, five distinct slides, and one real website visual.")
          PY

      - name: Test ledger-driven topic progression
        run: |
          python - <<'PY'
          from src.generate_content import TOPIC_PLAN, next_topic_index_from_ledger

          day1, day2, day3, day4 = [entry["topic"] for entry in TOPIC_PLAN[:4]]
          history = {
              "2026-10-11-request-18": {
                  "status": "published",
                  "topic": day1,
                  "published_at": "2026-10-11T01:52:41+05:30",
              },
              "2026-10-12-request-20": {
                  "status": "published",
                  "topic": day2,
                  "published_at": "2026-10-12T14:13:09+05:30",
              },
              "2026-10-12-correction-22": {
                  "status": "published",
                  "topic": day2,
                  "published_at": "2026-10-12T16:19:44+05:30",
              },
              "2026-10-12-extra-23": {
                  "status": "published",
                  "topic": day3,
                  "published_at": "2026-10-12T20:52:58+05:30",
              },
              "2026-10-13-failed-attempt": {
                  "status": "needs_review",
                  "topic": day4,
                  "started_at": "2026-10-13T04:01:00+05:30",
              },
          }
          if next_topic_index_from_ledger(history) != 3:
              raise SystemExit("After confirmed Day 3, the next topic must be Day 4 even when a later attempt is uncertain.")

          history["2026-10-13-day4"] = {
              "status": "published",
              "topic": day4,
              "published_at": "2026-10-13T04:04:00+05:30",
          }
          if next_topic_index_from_ledger(history) != 4:
              raise SystemExit("After confirmed Day 4, the next topic must be Day 5.")

          history["2026-11-08-day30"] = {
              "status": "published",
              "topic": TOPIC_PLAN[-1]["topic"],
              "published_at": "2026-11-08T04:04:00+05:30",
          }
          if next_topic_index_from_ledger(history) != 0:
              raise SystemExit("After confirmed Day 30, the topic sequence must wrap to Day 1.")
          print("Ledger topic progression passed: Day 3 -> Day 4 -> Day 5, and Day 30 -> Day 1.")
          PY

      - name: Render a synthetic five-slide video without using an API
        run: |
          cat > content.json <<'JSON'
          {
            "topic": "Video rendering smoke test",
            "post": "This synthetic sample checks that the local slide renderer can create an MP4 before any paid text generation or public posting runs.",
            "video_title": "Video rendering smoke test",
            "hashtags": ["SoftwareDevelopment", "MCAStudent", "LearningInPublic"],
            "slides": [
              {"title": "Start with a clear problem", "body": "A useful feature begins with a specific task to solve.", "visual_type": "flow"},
              {"title": "Separate data from display", "body": "Keep values distinct from the components that show them.", "visual_type": "code"},
              {"title": "Draw the information clearly", "body": "A compact chart can make the relationship easier to follow.", "visual_type": "chart"},
              {"title": "Check each important input", "body": "Validate the information before it changes stored data.", "visual_type": "checklist"},
              {"title": "Finish with a simple takeaway", "body": "Clear steps help another developer follow the implementation.", "visual_type": "learning"}
            ]
          }
          JSON
          python src/create_video.py
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,pix_fmt -show_entries format=duration,format_name -of json linkedin_video.mp4
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          result = subprocess.run([
              "ffprobe", "-v", "error",
              "-show_entries", "stream=codec_name,codec_type,width,height,r_frame_rate,pix_fmt",
              "-show_entries", "format=duration,format_name",
              "-of", "json", "linkedin_video.mp4"
          ], capture_output=True, text=True, check=True)
          data = json.loads(result.stdout)
          streams = data.get("streams", [])
          stream = next((entry for entry in streams if entry.get("codec_type") == "video"), None)
          duration = float(data["format"]["duration"])
          size = Path("linkedin_video.mp4").stat().st_size
          format_names = data["format"].get("format_name", "").split(",")
          if not stream or stream.get("codec_name") != "h264":
              raise SystemExit("Smoke-test output must use H.264 video.")
          if stream.get("width") != 1080 or stream.get("height") != 1350:
              raise SystemExit("Smoke-test dimensions must be 1080 x 1350.")
          if stream.get("r_frame_rate") != "24/1" or stream.get("pix_fmt") != "yuv420p":
              raise SystemExit("Video must retain 24 fps and yuv420p pixel format.")
          if not 15.5 <= duration <= 16.2:
              raise SystemExit(f"Unexpected test video duration: {duration:.2f}s.")
          if "mp4" not in format_names or any(entry.get("codec_type") == "audio" for entry in streams):
              raise SystemExit("Output must be a silent MP4, like the current LinkedIn format.")
          if not 50_000_000 <= size <= 70_000_000:
              raise SystemExit(f"Expected a 50-70 MB video matching the current upload format, got {size:,} bytes.")
          print("Video renderer smoke test passed: H.264 MP4, 1080x1350, 24 fps, 15.5-16.2 seconds, no audio, 50-70 MB.")
          PY


      - name: Validate dashboard data and owner-only publishing request
        env:
          DASHBOARD_ISSUES_FILE: ${{ runner.temp }}/dashboard-issues.json
        run: |
          python -m py_compile scripts/build_dashboard_data.py
          echo '[]' > "$DASHBOARD_ISSUES_FILE"
          python scripts/build_dashboard_data.py
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("dashboard/data.json").read_text(encoding="utf-8"))
          page = Path("dashboard/index.html").read_text(encoding="utf-8")
          publisher = Path(".github/workflows/publish-plan-day.yml").read_text(encoding="utf-8")
          deployer = Path(".github/workflows/pages-dashboard.yml").read_text(encoding="utf-8")
          if len(data.get("topics", [])) != 30:
              raise SystemExit("The dashboard must render all 30 content-plan topics.")
          if not all({"day", "topic", "plannedDate", "status", "canPublish"} <= set(row) for row in data["topics"]):
              raise SystemExit("Each dashboard row must include day, topic, date, status, and publish availability.")
          if any(row["canPublish"] and row["status"] != "planned" for row in data["topics"]):
              raise SystemExit("Only unpublished planned topics may expose an enabled Publish action.")
          forbidden = {"sourceFacts", "hashtags", "postText", "accessToken", "ledger"}
          if forbidden.intersection(data):
              raise SystemExit("The public dashboard snapshot must not expose source facts, post copy, credentials, or the raw ledger.")
          if "window.setInterval(refresh,30000)" not in page or "PUBLISH_PLAN_DAY=" not in page or "publishNextBtn" not in page:
              raise SystemExit("The dashboard must auto-refresh and expose a next-post publish control.")
          if "day == next_day_expected" not in Path("scripts/build_dashboard_data.py").read_text(encoding="utf-8"):
              raise SystemExit("The dashboard must enable publishing only for the next plan topic.")
          if "PUBLISH_TOPIC_DAY:" not in publisher or "github.event.issue.user.login == github.repository_owner" not in publisher:
              raise SystemExit("Selected-day publishing must validate the requested day and remain owner-only.")
          if "expected_day" not in publisher or "group: linkedin-plan-day-publication" not in publisher:
              raise SystemExit("Manual publishing must validate sequence while remaining isolated from the scheduled workflow's queue.")
          publisher_code = Path("src/publish_linkedin.py").read_text(encoding="utf-8")
          if 'persist_ledger(ledger, f"Reserve LinkedIn video publication for {date_key}")' not in publisher_code:
              raise SystemExit("The publisher must reserve the daily slot in the ledger before uploading, protecting against races without delaying the scheduled run.")
          if "group: linkedin-publishing" not in Path(".github/workflows/daily-linkedin.yml").read_text(encoding="utf-8"):
              raise SystemExit("The daily publishing concurrency guard must remain enabled.")
          if "actions/deploy-pages@" not in deployer or "DASHBOARD_ISSUES_FILE" not in deployer:
              raise SystemExit("The dashboard deployment workflow must publish Pages with a sanitized status snapshot.")
          if 'cron: "35 18 * * *"' not in deployer or 'cron: "30 3-8 * * 2,5"' not in Path(".github/workflows/daily-linkedin.yml").read_text(encoding="utf-8"):
              raise SystemExit("The dashboard must refresh after midnight IST without changing the Tuesday and Friday publishing schedule.")
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          from scripts.build_dashboard_data import scheduled_date_after, first_available_publish_date
          tz = ZoneInfo("Asia/Kolkata")
          if scheduled_date_after(date(2026, 10, 15), 1) != date(2026, 10, 16):
              raise SystemExit("After a Thursday publication, the next scheduled slot must be Friday.")
          if scheduled_date_after(date(2026, 10, 16), 1) != date(2026, 10, 20):
              raise SystemExit("After a Friday publication, the next scheduled slot must be Tuesday.")
          if first_available_publish_date(datetime(2026, 10, 16, 8, 45, tzinfo=tz), True, date(2026, 10, 15)) != date(2026, 10, 16):
              raise SystemExit("A still available Friday slot before 14:00 IST must remain scheduled for today.")
          if first_available_publish_date(datetime(2026, 10, 16, 15, 0, tzinfo=tz), True, date(2026, 10, 15)) != date(2026, 10, 20):
              raise SystemExit("A missed Friday slot must roll forward to Tuesday instead of remaining in the past.")
          print("Dashboard validation passed: 30 topics, next-topic publish guard, owner-only requests, Tuesday and Friday 09:00 IST schedule, authentic TruLoop screenshots, and auto-refresh.")
          PY
