name: Test AI LinkedIn Post and Animated Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate LinkedIn post and slides
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
        run: python src/generate_content.py

      - name: Install Chromium for genuine TruLoop site capture
        run: python -m playwright install --with-deps chromium

      - name: Capture the deployed TruLoop homepage for video visuals
        run: python src/capture_truloop_site.py

      - name: Render animated MP4
        run: python src/create_video.py

      - name: Validate and upload preview artifact
        run: |
          test -s content.json
          test -s linkedin_video.mp4
          python -m json.tool content.json > /dev/null
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json linkedin_video.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          content = json.loads(Path("content.json").read_text(encoding="utf-8"))
          if len(content.get("slides", [])) != 5:
              raise SystemExit("Exactly five slides are required.")
          if len(content.get("post", "").split()) > 110:
              raise SystemExit("Post body is longer than 110 words.")
          print("Video preview validation passed.")
          PY

      - name: Save preview
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-video-content
          path: |
            content.json
            linkedin_video.mp4
          if-no-files-found: error
          retention-days: 3
